name: Connection App CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -s index.html
      - run: test -s app.js
      - run: test -s styles.css
      - run: test -s manifest.webmanifest
      - run: test -s service-worker.js
      - run: test ! -e vercel.json
